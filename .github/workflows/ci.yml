name: ci

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  quality-check:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: city_db
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: src/server

      - name: Test SQL Deltas
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          
          for file in $(ls src/db/*.sql | sort); do
            echo "Applying $file..."
            PGPASSWORD=password psql -h localhost -U postgres -d city_db -f "$file"
          done

      - name: Run Prettier Check
        run: npm run format:check
        working-directory: src/server

      - name: Run Eslint Check
        run: npm run lint
        working-directory: src/server

      - name: Run Unit Tests
        run: npm test
        working-directory: src/server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: city_db

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-push:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./src/server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./src/client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:${{ github.sha }}

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create temporary K8s Cluster (Kind)
        uses: helm/kind-action@v1.4.0

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/

      - name: Deploy to Cluster
        run: |
          # These commands now run against the temporary Kind cluster
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/db-deployment.yaml
          kubectl apply -f k8s/db-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          
          kubectl rollout status deployment/backend-deployment --timeout=60s
