name: ci

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  quality-check:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: city_db
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: src/server

      - name: Test SQL Deltas
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          
          for file in $(ls src/db/*.sql | sort); do
            echo "Applying $file..."
            PGPASSWORD=password psql -h localhost -U postgres -d db -f "$file"
          done

      - name: Run Prettier Check
        run: npm run format:check
        working-directory: src/server

      - name: Run Eslint Check
        run: npm run lint
        working-directory: src/server

      - name: Run Unit Tests
        run: npm test
        working-directory: src/server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: city_db

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-images:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        run: docker build -t devops-backend:${{ github.sha }} ./src/server

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image
        run: |
          docker build -t devops-frontend ./src/client

